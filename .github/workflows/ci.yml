name: CI

on:
  pull_request:
  push:
    branches: [main]

# テストは読み取りだけで足りるため、トークンの権限を最小にする。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 依存がなく node:test だけを使うため、LTS の 1 系統で足りる。複数バージョンの matrix は採らない。
          node-version: 24
      - run: node --test
